<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI SaaS Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #3b82f6;
  --accent2: #06b6d4;
  --text: #e2e8f0;
  --muted: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 20px 40px;
  font-size: 20px;
  font-weight: 600;
  border-bottom: 1px solid #1e293b;
}

.container {
  padding: 30px 40px;
}

.grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 20px;
}

.card {
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
}

.card h3 {
  margin-bottom: 15px;
}

.metric-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
}

canvas {
  width: 100%;
  height: 300px;
  background: #0b1220;
  border-radius: 8px;
}

.status {
  display: flex;
  align-items: center;
  gap: 10px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { opacity: 0.5; }
  50% { opacity: 1; }
  100% { opacity: 0.5; }
}
</style>
</head>
<body>

<header>
  🚀 AI SaaS Dashboard — Real-Time AI API Monitoring
</header>

<div class="container">
  <div class="grid">
    
    <!-- Live Chart -->
    <div class="card">
      <h3>Live API Latency (ms)</h3>
      <canvas id="chart"></canvas>
    </div>

    <!-- Metrics -->
    <div class="card">
      <h3>Requests / sec</h3>
      <div class="metric-value" id="rps">0</div>
    </div>

    <div class="card">
      <h3>Status</h3>
      <div class="status">
        <div class="dot"></div>
        <span>WebSocket Connected</span>
      </div>
    </div>

  </div>
</div>

<script>
// ------------------------------
// Web Worker for Data Processing
// ------------------------------
const workerCode = `
let latency = 100;

function randomData() {
  latency = latency + (Math.random() - 0.5) * 20;
  latency = Math.max(50, Math.min(200, latency));
  return {
    latency: Math.round(latency),
    rps: Math.floor(Math.random() * 200 + 50)
  };
}

setInterval(() => {
  postMessage(randomData());
}, 200);
`;

const blob = new Blob([workerCode], { type: "application/javascript" });
const worker = new Worker(URL.createObjectURL(blob));

// ------------------------------
// Canvas Chart Rendering
// ------------------------------
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
canvas.width = canvas.offsetWidth;
canvas.height = 300;

let dataPoints = [];

function drawChart() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.beginPath();
  ctx.strokeStyle = "#3b82f6";
  ctx.lineWidth = 2;

  dataPoints.forEach((value, index) => {
    const x = (index / 50) * canvas.width;
    const y = canvas.height - (value / 250) * canvas.height;
    if (index === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });

  ctx.stroke();
}

function animate() {
  drawChart();
  requestAnimationFrame(animate);
}

animate();

// ------------------------------
// Simulated WebSocket Stream
// ------------------------------
worker.onmessage = (event) => {
  const { latency, rps } = event.data;

  dataPoints.push(latency);
  if (dataPoints.length > 50) dataPoints.shift();

  document.getElementById("rps").innerText = rps;
};
</script>

</body>
</html>
